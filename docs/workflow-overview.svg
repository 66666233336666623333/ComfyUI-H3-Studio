<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
<title id="title">H3 Studio workflow overview</title><desc id="desc">Prompt and references feed the H3 engine. Optional FunControl feeds pose processing and preview. The engine outputs video to save and preview.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d1729"/><stop offset="1" stop-color="#142c35"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#7199b5"/></marker></defs>
<rect width="1200" height="540" rx="20" fill="url(#bg)"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="42" y="60" font-size="32" font-weight="700" fill="#f1f6ff">H3 STUDIO</text><text x="42" y="90" font-size="15" fill="#a7bfd1">MiniMax H3 · FastH3 · optional LoRA &amp; FunControl</text><text x="1158" y="62" text-anchor="end" fill="#8bbdc5" font-size="13">SIX NODES / NATIVE EXECUTION</text>
<g fill="none" stroke="#7199b5" stroke-width="2" marker-end="url(#arrow)"><path d="M270 192 H334 V215 H630"/><path d="M270 330 H320 V245 H630"/><path d="M562 210 H600 V275 H630" stroke-dasharray="6 5"/><path d="M760 360 V414 H562"/><path d="M880 222 H925"/></g>
<rect x="38" y="136" width="232" height="112" rx="12" fill="#1b304b" stroke="#385679"/><text x="56" y="169" font-size="18" font-weight="600" fill="#eff5ff">01  Prompt</text><text x="56" y="200" font-size="14" fill="#b6cbdf">Write / choose a text file</text><text x="56" y="224" font-size="13" fill="#9ab2ca">UTF · ASCII · GB encodings</text>
<rect x="38" y="274" width="232" height="126" rx="12" fill="#1a3a33" stroke="#3e6c59"/><text x="56" y="310" font-size="18" font-weight="600" fill="#effaf5">02  References</text><text x="56" y="340" font-size="14" fill="#b9d9ce">Images / audio / video</text><text x="56" y="367" font-size="13" fill="#91bbab">Select slots · toggle each file</text>
<rect x="364" y="136" width="198" height="156" rx="12" fill="#3b3023" stroke="#766046"/><text x="382" y="169" font-size="18" font-weight="600" fill="#fff6e5">03  Control video</text><text x="382" y="201" font-size="14" fill="#d8c2a7">Input preview</text><text x="382" y="227" font-size="13" fill="#bca789">Start / duration</text><text x="382" y="267" font-size="12" fill="#ecce91">OFF = branch omitted</text>
<rect x="364" y="360" width="198" height="104" rx="12" fill="#3b3023" stroke="#766046"/><text x="382" y="396" font-size="18" font-weight="600" fill="#fff6e5">05  Pose preview</text><text x="382" y="430" font-size="13" fill="#cbb69a">Native PreviewImage</text>
<rect x="630" y="136" width="250" height="224" rx="12" fill="#24365c" stroke="#6785b8"/><text x="650" y="172" font-size="20" font-weight="600" fill="#f1f5ff">04  Generation</text><text x="650" y="208" font-size="14" fill="#c0d0ec">MiniMax H3 / FastH3 models</text><text x="650" y="239" font-size="14" fill="#c0d0ec">LoRA · FunControl switches</text><text x="650" y="270" font-size="14" fill="#c0d0ec">Resolution presets · 3–15 s</text><text x="650" y="301" font-size="14" fill="#c0d0ec">Seed · steps · advanced options</text><text x="650" y="336" font-size="12" fill="#91afd7">Expands into native ComfyUI nodes</text>
<rect x="925" y="136" width="237" height="224" rx="12" fill="#1b3b46" stroke="#3e7986"/><text x="945" y="172" font-size="20" font-weight="600" fill="#edfcff">06  Output</text><text x="945" y="210" font-size="14" fill="#b4d7dd">Video playback preview</text><text x="945" y="242" font-size="14" fill="#b4d7dd">MP4 / MKV / WebM</text><text x="945" y="274" font-size="14" fill="#b4d7dd">Default or custom directory</text><text x="945" y="336" font-size="12" fill="#8fbdc6">Ready to save and review</text>
<text x="42" y="510" font-size="13" fill="#93abbc">FastH3 selects its own model and VSA pattern; LoRA and FunControl are excluded in that mode.</text></g></svg>